name: Build Telegram APK

on:
  workflow_dispatch:
  push:
    branches:
      - codex/add-true-karaoke-support-to-lyrics-feature

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Telegram
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android dependencies
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;27.2.12479018"
          sdkmanager "cmake;3.22.1"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p apk
          find TMessagesProj_App/build/outputs/apk -name "*.apk" -exec cp {} apk/Telegram-Lyrics-Test.apk \;
          ls -lh apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Android-Debug
          path: apk/Telegram-Lyrics-Test.apk
