name: Build Telegram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Telegram
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;27.2.12479018"
          sdkmanager "cmake;3.22.1"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build standalone APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --no-daemon

      - name: Collect APK
        run: |
          mkdir -p apk
          APK_PATH=$(find TMessagesProj_AppStandalone/build/outputs/apk -type f -name "*.apk" | head -n 1)
          test -n "$APK_PATH"
          cp "$APK_PATH" apk/Telegram-Lyrics-Standalone.apk
          ls -lh apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Android-Standalone
          path: apk/Telegram-Lyrics-Standalone.apk
